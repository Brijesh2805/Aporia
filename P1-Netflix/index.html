<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="nav-container">
      <nav class="nav-bar">
        <img src="images/Netflix.png" alt="Netflix" id="netflix-logo" />

        <div class="nav-links_container">
          <a href="#" class="nav-links">Tv shows</a>
          <a href="#" class="nav-links">Movies</a>
          <a href="#" class="nav-links">Recently Added</a>
          <a href="#" class="nav-links">My List</a>
        </div>
      </nav>
      <div class="form-container">
        <form action="#" class="input-container">
          <input type="text" placeholder="Search here" />
          <button type="submit" class="search-btn" aria-label="Search">
            <span class="material-symbols-outlined">search</span>
          </button>
        </form>
      </div>
    </header>
  </body>
</html>
