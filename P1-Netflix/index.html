<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="nav-container">
      <nav class="nav-bar">
        <img src="images/Netflix.png" alt="Netflix" id="netflix-logo" />

        <div class="nav-links_container">
          <a href="#" class="nav-links">Tv shows</a>
          <a href="#" class="nav-links">Movies</a>
          <a href="#" class="nav-links">Recently Added</a>
          <a href="#" class="nav-links">My List</a>
        </div>
      </nav>
      <div class="form-container">
        <form action="#" class="input-container">
          <input type="text" placeholder="Search here" />
          <button type="submit" class="search-btn" aria-label="Search">
            <span class="material-symbols-outlined">search</span>
          </button>
        </form>
      </div>
    </header>

    <main>
      <section class="hero-section">
        <div class="hero-content">
          <div class="featured-label">
            <h5>FEATURED SERIES</h5>
            <span class="material-symbols-outlined info-btn">info</span>
          </div>
          <h2>DARK</h2>
          <p>
            When a child disappears in the small town of Winden, four families
            uncover a mystery that spans generations and challenges their
            understanding of time.
          </p>
          <div class="hero-buttons">
            <button>▶ Play</button>
            <button>More info</button>
          </div>
        </div>
      </section>

      <section class="trending-movies">
        <h2>Trending now</h2>
        <div class="movie-list">
          <div class="movie-card">
            <img src="images/Movie1.jpg" alt="Movie1" />
          </div>
          <div class="movie-card">
            <img src="images/Movie2.jpg" alt="Movie2" />
          </div>
          <div class="movie-card">
            <img src="images/Movie3.jpg" alt="" />
          </div>
          <div class="movie-card">
            <img src="images/Movie4.jpg" alt="Movie4" />
          </div>
          <div class="movie-card">
            <img src="images/Movie5.jpg" alt="Movie5" />
          </div>
          <div class="movie-card">
            <img src="images/Movie6.jpg" alt="Movie6" />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
